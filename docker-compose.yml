services:
  house-postgres:
    image: postgres:16
    container_name: house-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-house_agent}
      POSTGRES_USER: ${POSTGRES_USER:-house_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - house_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-house_agent} -d ${POSTGRES_DB:-house_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  house-redis:
    image: redis:7.2-alpine
    container_name: house-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - house_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  house-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: house-agent-backend:latest
    container_name: house-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql://house_agent:${POSTGRES_PASSWORD}@house-postgres:5432/house_agent}
      REDIS_URI: ${REDIS_URI:-redis://house-redis:6379}
    ports:
      - "8001:8001"
    depends_on:
      house-postgres:
        condition: service_healthy
      house-redis:
        condition: service_healthy

  house-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: house-agent-frontend:latest
    container_name: house-frontend
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      - house-backend

volumes:
  house_postgres_data:
  house_redis_data:
